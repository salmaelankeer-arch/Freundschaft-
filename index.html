
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يصديقي - ذكرياتنا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff85a2;
            --primary-dark: #f472b6;
            --soft-pink: #fff1f2;
            --dark: #1f2937;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--soft-pink);
            background-image: radial-gradient(#ff85a222 1px, transparent 0);
            background-size: 30px 30px;
            color: var(--dark);
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* شاشة الدخول */
        #auth-screen {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: transform 0.8s cubic-bezier(0.87, 0, 0.13, 1), opacity 0.6s ease;
        }

        .auth-card {
            background: white;
            padding: 2.5rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(244, 114, 182, 0.25);
            max-width: 380px;
            width: 90%;
            border: 1px solid #fee2e2;
        }

        .pass-input {
            width: 100%;
            border: 2px solid #fecaca;
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
            font-size: 1.8rem;
            margin: 1.5rem 0;
            letter-spacing: 0.5rem;
            color: var(--primary-dark);
            font-weight: 800;
            transition: all 0.3s;
        }

        .pass-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.1);
        }

        /* المحتوى الرئيسي */
        .main-wrapper {
            display: none;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            padding: 20px 15px 140px 15px;
        }

        .header-msg {
            padding: 40px 10px;
            text-align: center;
        }

        .typewriter-box {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            line-height: 1.8;
            color: #9d174d;
            background: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 2.5rem;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5), 0 10px 25px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid white;
        }

        /* بطاقات الميديا */
        .item-container {
            position: relative;
            border-radius: 2rem;
            overflow: hidden;
            background: white;
            padding: 10px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 0.9s cubic-bezier(0.17, 0.55, 0.55, 1);
        }

        .item-container.revealed {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .item-container img, .item-container video {
            width: 100%;
            border-radius: 1.5rem;
            display: block;
            object-fit: cover;
        }

        /* مشغل الموسيقى */
        .music-pill {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.2);
            z-index: 100;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 90%;
            max-width: 320px;
            transition: all 0.3s ease;
        }

        .play-btn {
            background: linear-gradient(135deg, #f472b6, #db2777);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
        }

        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            animation: floatUp 4s ease-in forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg) scale(1.5); opacity: 0; }
        }

        .unlock-anim {
            transform: translateY(-100%) !important;
            opacity: 0 !important;
        }
    </style>
</head>
<body>

    <audio id="audio-player" loop>
        <source src="https://res.cloudinary.com/dyiekoiz4/video/upload/v1775508863/54e0639b4759c801684e01054feb65fc_v84pmf.mp3" type="audio/mpeg">
    </audio>

    <div id="auth-screen">
        <div class="auth-card">
            <div class="inline-block p-4 bg-pink-50 rounded-full mb-6">
                <span class="text-5xl animate-pulse inline-block">🔒</span>
            </div>
            <!-- النص المحدث في صفحة التسجيل -->
            <h1 class="text-2xl font-bold text-gray-800">جاهز يصديقي 😉</h1>
            <p class="text-gray-500 text-sm mt-2"> مسامسا</p>
            <input type="tel" id="pass-input" maxlength="4" placeholder="••••" class="pass-input">
            <button onclick="unlock()" class="w-full bg-gradient-to-r from-pink-400 to-pink-600 text-white font-bold py-4 rounded-xl shadow-lg hover:scale-[1.02] active:scale-95 transition-all">
                افتح صندوق الذكريات ✨
            </button>
            <p id="error" class="text-red-500 mt-4 text-sm font-medium opacity-0 transition-opacity">الرقم غلط.. حاول تاني يا بطل!</p>
        </div>
    </div>

    <div id="main-content" class="main-wrapper">
        <header class="header-msg">
            <div id="text-box" class="typewriter-box"></div>
        </header>

        <div class="media-stack">
            <div class="item-container">
                <img src="https://i.postimg.cc/Nf0R9c23/75937e40aa434ba1fb7b6cf8393ebfce.jpg" alt="ذكرى 1">
            </div>

            <div class="item-container">
                <img src="https://i.postimg.cc/jqczS5Cx/9be14993c73f717a89d193b536f7f927.jpg" alt="ذكرى 2">
            </div>

            <!-- الفيديو الجديد المحدث -->
            <div class="item-container">
                <video id="vlog" controls playsinline>
                    <source src="https://res.cloudinary.com/dyiekoiz4/video/upload/v1775510455/_fyp__%D9%81%D8%A7%D9%83%D8%B1%D9%87_%D8%A7%D9%84%D8%B7%D8%B1%D9%8A%D9%82_%D8%A7%D9%88%D9%82%D8%A7%D8%AA_%D9%8A%D8%B6%D9%8A%D9%82__%D9%81%D9%8A%D9%84%D9%85_%D9%A6_%D8%A3%D9%8A%D8%A7%D9%85_MP4_bxzwcz.mp4" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            </div>

            <div class="item-container">
                <img src="https://i.postimg.cc/7P9gZ6bk/9d828d2605dacc06b20b82495a587cc6.jpg" alt="ذكرى 3">
            </div>

            <div class="item-container">
                <img src="https://i.postimg.cc/NGD1jMLQ/c9b4751583f2676f57a74016a95d29ed.jpg" alt="ذكرى 4">
            </div>

            <div class="text-center py-16">
                <div class="text-pink-600 font-bold text-2xl mb-4">دمت لي شيئاً لا ينتهي ❤️</div>
                <div class="flex justify-center gap-4 text-2xl">
                    <span class="animate-bounce" style="animation-delay: 0.1s">✨</span>
                    <span class="animate-bounce" style="animation-delay: 0.2s">🌸</span>
                    <span class="animate-bounce" style="animation-delay: 0.3s">✨</span>
                </div>
            </div>
        </div>
    </div>

    <div id="music-pill" class="music-pill opacity-0 pointer-events-none">
        <div class="play-btn" onclick="togglePlay()" id="play-trigger">
            <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <div class="flex-1 overflow-hidden text-right">
            <p class="text-[10px] uppercase tracking-widest text-pink-500 font-bold">جاري التشغيل</p>
            <p class="text-sm font-bold text-gray-700 truncate">ذكرى غالية 🎶</p>
        </div>
        <div class="flex items-end gap-1 h-4" id="visualizer">
            <div class="w-1 bg-pink-400 rounded-full animate-bounce h-2"></div>
            <div class="w-1 bg-pink-500 rounded-full animate-bounce h-4" style="animation-delay: 0.1s"></div>
            <div class="w-1 bg-pink-300 rounded-full animate-bounce h-3" style="animation-delay: 0.2s"></div>
        </div>
    </div>

    <script>
        const story = "عارف.. البداية كانت صدفة في ٢٠٢٠، كنا لسه في أولى ثانوي.. وبعدين درس الإنجليزي اللي قربنا من بعض فيه، وبقينا أعز وأغلى صحاب. بحب فيك دماغك وطموحك اللي مش بيخلص وسعيك وهبلك وكل حاجة فيك. شكراً إنك موجود في حياتي يصديقي.";
        const audio = document.getElementById('audio-player');
        
        const playIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
        const pauseIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;

        function unlock() {
            const input = document.getElementById('pass-input');
            const error = document.getElementById('error');
            
            if(input.value === '2020') {
                const screen = document.getElementById('auth-screen');
                screen.classList.add('unlock-anim');
                
                setTimeout(() => {
                    screen.style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    const pill = document.getElementById('music-pill');
                    pill.classList.remove('opacity-0', 'pointer-events-none');
                    
                    audio.play().then(() => updateMusicUI(true)).catch(() => updateMusicUI(false));
                    
                    typeWriter();
                    startScrollObserver();
                    createHearts();
                }, 800);
            } else {
                error.style.opacity = '1';
                setTimeout(() => error.style.opacity = '0', 2000);
            }
        }

        function togglePlay() {
            if (audio.paused) { audio.play(); updateMusicUI(true); } 
            else { audio.pause(); updateMusicUI(false); }
        }

        function updateMusicUI(isPlaying) {
            document.getElementById('play-trigger').innerHTML = isPlaying ? pauseIcon : playIcon;
            document.getElementById('visualizer').style.opacity = isPlaying ? '1' : '0.3';
        }

        function typeWriter() {
            const target = document.getElementById('text-box');
            let i = 0;
            function write() {
                if(i < story.length) {
                    target.innerHTML += story.charAt(i);
                    i++;
                    setTimeout(write, 60);
                }
            }
            write();
        }

        function startScrollObserver() {
            const items = document.querySelectorAll('.item-container');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if(entry.isIntersecting) entry.target.classList.add('revealed');
                });
            }, { threshold: 0.1 });
            items.forEach(item => observer.observe(item));
        }

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = ['❤️', '💖', '✨', '🌸'][Math.floor(Math.random()*4)];
                heart.className = 'floating-heart';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 600);
        }

        document.getElementById('pass-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') unlock();
        });
    </script>
</body>
</html>

```
